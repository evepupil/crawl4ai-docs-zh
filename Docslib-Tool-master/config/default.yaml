# DocsLib 默认配置文件
# 包含所有模块共享的配置项

# 全局设置
global:
  # 项目名称
  project_name: "DocsLib"
  # 项目版本
  version: "0.1.0"
  # 默认语言设置
  source_lang: "en"
  target_lang: "zh"

# 日志设置
logging:
  level: "INFO"  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s"
  console: true  # 是否输出到控制台
  file: "docslib.log"  # 日志文件名
  max_size: 10485760  # 日志文件最大大小（字节）
  backup_count: 5  # 保留的日志文件数量

# 缓存设置
cache:
  enabled: true  # 是否启用缓存
  dir: ".cache"  # 缓存目录
  max_size: 104857600  # 缓存最大大小（字节）
  ttl: 2592000  # 缓存有效期（秒），默认30天

# 进度管理
progress:
  dir: ".progress"  # 进度文件保存目录
  save_interval: 10  # 保存进度的间隔（秒）

# 工作线程设置
workers:
  max_workers: 10  # 最大工作线程数
  timeout: 30  # 操作超时时间（秒） 