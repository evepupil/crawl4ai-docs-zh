# DocsLib翻译器配置文件

# 翻译服务配置
translation_service:
  provider: "yuanbao"  # 目前仅支持yuanbao
  base_url: "http://39.104.17.54:7999/v1/"  # 混元 API 基础URL
  model: "deepseek-v3"  # 使用的模型
  api_key: ""  # 可选的API密钥
  temperature: 1.3  # 温度参数，控制输出的随机性
  timeout: 30  # 请求超时时间（秒）
  
  # 元宝特有参数
  hy_source: "web"  # 来源标识
  hy_user: "d76efed3f1fb4cf1b1a3b4789111bc6c"  # 用户ID
  hy_token: ""
  agent_id: "naQivTmsDa"  # 智能体ID
  chat_id: ""  # 聊天ID（可选）

# 翻译设置
translation_settings:
  source_lang: "en"  # 源语言
  target_lang: "zh"  # 目标语言
  preserve_format: true  # 保留文档格式
  max_retry: 3  # 失败重试次数
  concurrent_requests: 5  # 并发请求数

# 日志设置
logging:
  level: "INFO"  # 日志级别: DEBUG, INFO, WARNING, ERROR, CRITICAL
  format: "%(asctime)s - %(name)s - %(levelname)s - %(filename)s:%(lineno)d - %(message)s"
  file: "docslib_translator.log"  # 日志文件名
  max_size: 10485760  # 日志文件最大大小（字节）
  backup_count: 5  # 保留的日志文件数量

# 缓存设置
cache:
  enabled: true  # 是否启用缓存
  dir: ".cache"  # 缓存目录
  max_size: 104857600  # 缓存最大大小（字节）
  ttl: 2592000  # 缓存有效期（秒），默认30天 