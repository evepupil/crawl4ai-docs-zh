theme:
  name: 'terminal'
  palette: 'dark'
  custom_dir: docs/md_v2_zh/overrides
  color_mode: 'dark'
  icon:
    repo: fontawesome/brands/github

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - attr_list
  - tables

extra:
  version: !ENV [CRAWL4AI_VERSION, 'development']

extra_css:
  - assets/layout.css
  - assets/styles.css
  - assets/highlight.css
  - assets/dmvendor.css
  - assets/feedback-overrides.css

extra_javascript:
  - https://www.googletagmanager.com/gtag/js?id=G-3FDPZ9D5QS
  - assets/gtag.js
  - assets/highlight.min.js
  - assets/highlight_init.js
  - https://buttons.github.io/buttons.js
  - assets/toc.js
  - assets/github_stats.js
  - assets/selection_ask_ai.js
  - assets/copy_code.js
  - assets/floating_ask_ai_button.js
  - assets/mobile_menu.js
  - https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-1149581082118045